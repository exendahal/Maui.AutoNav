name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (net10.0, no MAUI workload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore test/Maui.AutoNav.Tests/Maui.AutoNav.Tests.csproj

      - name: Test
        run: dotnet test test/Maui.AutoNav.Tests/Maui.AutoNav.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  build-and-pack:
    name: Build & pack (all MAUI targets)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore
        run: dotnet restore src/Maui.AutoNav/Maui.AutoNav.csproj

      - name: Build
        run: dotnet build src/Maui.AutoNav/Maui.AutoNav.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/Maui.AutoNav/Maui.AutoNav.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  build-sample:
    name: Build sample app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore
        run: dotnet restore samples/Maui.AutoNav.Sample/Maui.AutoNav.Sample.csproj

      - name: Build
        run: dotnet build samples/Maui.AutoNav.Sample/Maui.AutoNav.Sample.csproj --configuration Release --no-restore
